<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ошибка</title>
    <style>
      body {
        background-color: #fdf2f2;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .error-container {
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h1 {
        color: #e74c3c;
      }
      p {
        margin: 20px 0;
      }
      a {
        text-decoration: none;
        background-color: #3498db;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
      }
      a:hover {
        background-color: #2980b9;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <h1>Ошибка</h1>
      <p>{{ error_message }}</p>
      <a href="{{ url_for(redirect_url) }}">Вернуться назад</a>
    </div>
  </body>
</html>
